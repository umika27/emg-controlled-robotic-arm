[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "emg-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scipy", "matplotlib", "scikit-learn", "torch", "PyYAML", "tqdm"]
[project.optional-dependencies]
test = ["pytest"]
[project.scripts]
emg = "emg_pipeline.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
